apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx

spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx

    spec:
      container:
        -name : nginx-deployment
        image: kopilnagi/october-cstm-nginx:v1
        ports:
          -containerPorts: 80